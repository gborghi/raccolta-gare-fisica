name: Build GitHub Pages (reference) - single build

# THE single build of the site: scripts/build-pages.sh on the committed content/ (never
# preprocess.mjs). On main it publishes public/ to gh-pages (fast-forward, never --force).
# Cloudflare then mirrors gh-pages byte-for-byte (gborghi/site-fisica, workflow "Deploy").
# Figures must already be in gborghi/olifis-assets: the job can't push there with
# GITHUB_TOKEN, so if the build has new figures the olifis step fails BEFORE publishing
# (run `PUBLISH=1 scripts/build-pages.sh` locally once, or sync olifis-assets by hand).
on:
  push:
    branches: [main, "ci/**"]
    paths-ignore: ["DEPLOY.md", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # page dates = git dates of content/ commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Restore Quartz plugins
        run: npx quartz plugin restore || npm run install-plugins
      - name: git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build (+ publish gh-pages on main)
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          PUBLISH: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: bash scripts/build-pages.sh
      - name: Upload public/ (inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public
          retention-days: 3
